<style>
/* Layout: desktop = fixed left workspace sidebar + content column; phone = single column + bottom tab bar. Paper-and-ink notebook with a saffron pen accent and teal for "done/saved". */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --line:#D5DDDA;
  --fg:#16201E; --muted:#5B6966; --faint:#8A9894;
  --accent:#E2571B; --accent-ink:#B4440F; --accent-soft:#FBE7DC;
  --teal:#0F7C74; --teal-soft:#E1EFED;
  --urgent:#C7302B; --urgent-soft:#F9E0DE; --med:#8F6A04; --med-soft:#F6EDD5;
  --shadow:0 1px 2px rgba(22,32,30,.06),0 6px 20px rgba(22,32,30,.06);
  --display:'Anek Bangla','Noto Sans Bengali',system-ui,sans-serif;
  --body:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#0E0E0E; --surface-2:#1A1A1A; --line:#2A2A2A;
  --fg:#FFFFFF; --muted:#B5BDBA; --faint:#808886;
  --accent:#F0773F; --accent-ink:#F59A6B; --accent-soft:#3A2418;
  --teal:#45B8AD; --teal-soft:#16322F;
  --urgent:#F0716B; --urgent-soft:#3C1E1D; --med:#E2B84A; --med-soft:#3A3120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0E0E; --surface-2:#1A1A1A; --line:#2A2A2A;
  --fg:#FFFFFF; --muted:#B5BDBA; --faint:#808886;
  --accent:#F0773F; --accent-ink:#F59A6B; --accent-soft:#3A2418;
  --teal:#45B8AD; --teal-soft:#16322F;
  --urgent:#F0716B; --urgent-soft:#3C1E1D; --med:#E2B84A; --med-soft:#3A3120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:286px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 12px 24px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:38px;height:38px;flex-shrink:0;display:block}
.brand-mark svg{width:100%;height:100%;display:block}
.mbrand{display:none;align-items:center;gap:10px}
.mbrand b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;display:block}
.mbrand small{color:var(--muted);font-size:12px}
@media (max-width:899px){.mbrand{display:flex}}
.sheet h3 svg,.card h3 svg{width:20px;height:20px;vertical-align:-4px;flex-shrink:0}
.remind{background:var(--teal-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.remind h3{font-size:17px;font-weight:700;color:var(--teal);display:flex;align-items:center;justify-content:space-between;gap:8px}
.remind .link{border:0;background:none;padding:0;font-family:var(--body);font-size:13px;font-weight:600;color:var(--teal)}
.bigbtn{min-height:52px;font-size:16px;justify-content:center;width:100%;white-space:normal;text-align:center}
.rem-row{display:flex;flex-direction:column;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:10px}
.rem-row .lbl{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.rem-row .lbl svg{width:18px;height:18px;color:var(--accent)}
.brand b{font-family:var(--display);font-weight:800;font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.searchbtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted);text-align:left;font-size:14px}
.searchbtn svg{width:16px;height:16px;flex-shrink:0}
.searchbtn kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--surface)}
.navgrp{display:flex;flex-direction:column;gap:1px}
.pinrow{display:flex;align-items:center;gap:2px}.pinrow .nav{flex:1;min-width:0}.pinrow .nav span.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinrow .unpin{border:0;background:none;color:var(--faint);width:28px;height:28px;border-radius:6px;display:grid;place-items:center;flex:none}.pinrow .unpin:hover{background:var(--surface-2);color:var(--fg)}.pinrow .unpin svg{width:15px;height:15px}
.vwrap{position:relative}.vwrap .vpin{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--faint);width:28px;height:28px;border-radius:6px;display:grid;place-items:center}.vwrap .vpin svg{width:15px;height:15px}.vwrap .vpin.on{color:var(--accent)}.vwrap .vcard{padding-right:34px}.vcard.pinned{box-shadow:inset 3px 0 0 var(--accent)}
.navlabel{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--faint);padding:6px 8px 4px;display:flex;align-items:center;justify-content:space-between}
.navlabel button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;border-radius:6px}
.nav{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;border:0;background:none;width:100%;text-align:left;font-size:14px;color:var(--fg);min-height:34px}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav svg{width:18px;height:18px;flex-shrink:0;color:var(--muted)}
.nav.on svg{color:var(--accent-ink)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tree .nav{padding-left:calc(8px + var(--d,0) * 14px)}
.twist{width:16px;height:16px;border:0;background:none;padding:0;color:var(--faint);display:grid;place-items:center;flex-shrink:0;border-radius:4px}
.twist svg{width:12px;height:12px;transition:transform .15s}
.twist.open svg{transform:rotate(90deg)}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.sync{margin-top:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.sync.local i{background:var(--accent)}
/* main */
.main{flex:1;min-width:0;padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:720px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;color:var(--muted)}
.h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1.1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:14px;align-items:start}
.hgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:start;grid-auto-flow:row dense}.hgrid>div{min-width:0}
.hgrid>*{margin:0}.hgrid>.s6{grid-column:span 6}.hgrid>.s4{grid-column:span 4}.hgrid>.s3{grid-column:span 3}.hgrid>.s2{grid-column:span 2}
@media (max-width:1120px){.hgrid>.s4{grid-column:span 6}.hgrid>.s2{grid-column:span 3}}
@media (max-width:600px){.hgrid>*{grid-column:span 6 !important}}
.pipe-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}.pipe-mini .row{padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.lift{box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .link{font-family:var(--body);font-size:13px;font-weight:500;color:var(--teal);border:0;background:none;padding:0}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;min-height:40px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn svg{width:16px;height:16px;flex-shrink:0}
a.btn{text-decoration:none;color:var(--fg)}
.btn[disabled]{opacity:.55;cursor:default}
.iconbtn{width:36px;height:36px;border-radius:9px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.on{color:var(--accent)}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 12px;min-height:44px;font-size:15px}
.field:focus{border-color:var(--accent);outline:none}
textarea.field{resize:none;line-height:1.55}
select.field{min-height:38px;padding:6px 10px;font-size:14px;width:auto}
.capture{display:flex;gap:8px;align-items:flex-end}
.capture .field{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;min-height:32px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.p-urgent{background:var(--urgent-soft);color:var(--urgent)}
.p-high{background:var(--accent-soft);color:var(--accent-ink)}
.p-medium{background:var(--med-soft);color:var(--med)}
.p-low{background:var(--surface-2);color:var(--muted)}
.s-draft{background:var(--med-soft);color:var(--med)}
.s-working{background:var(--accent-soft);color:var(--accent-ink)}
.s-done{background:var(--teal-soft);color:var(--teal)}
.s-cancelled{background:var(--surface-2);color:var(--faint);text-decoration:line-through}
.list{display:flex;flex-direction:column;gap:6px}
.agegrp{display:flex;flex-direction:column;gap:6px}
.agelbl{font-size:13px;font-weight:700;color:var(--muted);padding:6px 2px 0;display:flex;gap:6px;align-items:baseline}
.agelbl span{font-weight:500;color:var(--faint);font-size:12px}
.dash-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dash-grid,.dash-col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media(min-width:900px){.dash-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.dash-grid{display:grid;grid-template-columns:1fr 1fr;align-items:start}}
.tile{background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:26px;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted)}
.sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.drow{display:flex;flex-direction:column;gap:5px;padding:7px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;width:100%}
button.drow{cursor:pointer}
.card h3+.drow{border-top:0}
.drow .h{display:flex;justify-content:space-between;gap:8px;font-size:14px;min-width:0}
.drow .h small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.mbars{display:flex;align-items:flex-end;gap:4px;height:120px}
.mbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.mbars div i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.mbars div small{font-size:10.5px;color:var(--faint);white-space:nowrap}
.mbars div em{font-style:normal;font-size:10.5px;color:var(--muted)}
.wbars{display:flex;align-items:flex-end;gap:3px;height:130px}
.wbars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.wbars .stk{display:flex;flex-direction:column-reverse;width:100%;max-width:22px;border-radius:4px 4px 0 0;overflow:hidden;gap:1px}
.wbars .stk i{display:block;min-height:3px}
.wbars .nodot{width:7px;height:7px;border-radius:50%;background:var(--line)}.wbars .nodot.on{background:var(--teal)}
.wbars small{font-size:10.5px;color:var(--faint);white-space:nowrap}.wbars small.tday{color:var(--accent);font-weight:600}
.wbars em{font-style:normal;font-size:10.5px;color:var(--muted)}
.wsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.wsum>div{background:var(--surface-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.wsum b{font-family:var(--display);font-size:20px;line-height:1.2}.wsum span{font-size:12px;color:var(--muted)}
h4.sub{margin:6px 0 0;font-size:13.5px;color:var(--muted);font-weight:600}
.item{background:var(--surface);border-radius:12px;padding:10px 8px 10px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0;border:1px solid transparent}
.item:hover{border-color:var(--line)}
.item .acts{display:flex;gap:4px;align-items:center;margin-left:auto}
.item .main-hit{flex:1 1 200px;min-width:0;border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:500;font-size:14.5px;overflow-wrap:break-word;word-break:normal}
@media(max-width:600px){.item .btn.sm .lbl{display:none}.item .btn.sm{padding:0 9px}}
.dghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:7px 12px;font-size:14px;box-shadow:var(--shadow);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-drag]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dragging{opacity:.35}
.drop-in{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)!important}
.drop-before{box-shadow:inset 0 3px 0 var(--accent)!important}
.drop-after{box-shadow:inset 0 -3px 0 var(--accent)!important}
.fmtbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.fmtbar button{min-width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:15px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;cursor:pointer}
.fmtbar .sw{width:26px;min-width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--surface)}
.fmtbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ed-body{white-space:pre-wrap;overflow-wrap:break-word}
.ed-body:empty:before{content:attr(data-ph);color:var(--faint)}
.ed-body h3{font-size:1.1em;font-weight:700;margin:.4em 0}
.ed-body ul,.ed-body ol{padding-left:1.4em}
.ed-body img{display:block;max-width:100%;height:auto;border-radius:10px;margin:.6em 0;background:var(--surface-2);min-height:40px}
:root.fs-sm .ed-body{font-size:14px}:root.fs-lg .ed-body{font-size:17.5px}
.set-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.card h3+.set-row,.card .hint+.set-row{border-top:0}
.set-row .grow{flex:1;min-width:0}
.set-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.accents{display:flex;gap:8px;flex-wrap:wrap}
.accents button{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.accents button.on{box-shadow:0 0 0 2px var(--fg)}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--faint)}

.check.p-urgent,.check.p-high{border-color:var(--accent)}
.check.done{background:var(--teal);border-color:var(--teal)}
.check svg{width:14px;height:14px;color:#fff}
.done-t{text-decoration:line-through;color:var(--faint)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.folder{background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;border:1px solid transparent;text-align:left;min-width:0}
.folder:hover{border-color:var(--line)}
.folder .fi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.folder .fi svg{width:18px;height:18px}
.folder b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.folder small{color:var(--muted);font-size:12px}
.backbar{margin:0 0 10px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;width:fit-content}
.backbtn{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font-family:var(--body);font-size:15px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.backbtn svg{width:20px;height:20px}

async function initStore(){

  try { cap = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch(e){ cap = null; }
  if(!cap){ try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){} await loadLocal(); mode = 'local'; COLS.forEach(c => ready[c] = true); render(); return; }
  db = cap; mode = 'cloud';
  COLS.forEach(c => {
    db.collection(c).limit(1000).onSnapshot(snap => {
      const o = {};
      snap.docs.forEach(d => { if(d.exists) o[d.id] = Object.assign({}, d.data(), {id:d.id}); });
      S[c] = o; ready[c] = true;
      scheduleRender();
    }, err => { ready[c] = true; onErr(err); scheduleRender(); });
  });
}

const items = () => Object.values(S.items);
function chain(i){ const out = []; let p = i && i.parentId, n = 0; while(p && S.items[p] && n++ < 50){ out.unshift(S.items[p]); p = S.items[p].parentId; } return out; }
const trashed = i => !!i.trashedAt || chain(i).some(a => a.trashedAt);
const archivedDeep = i => !!i.archived || chain(i).some(a => a.archived);
const visible = i => !trashed(i) && !archivedDeep(i);
const pages = () => items().filter(i => i.type === 'page' && visible(i));
const isInbox = i => i.type === 'page' && i.inbox;
function kids(pid){
  return items().filter(i => (i.parentId || null) === (pid || null) && !i.trashedAt && !i.archived && !i.inbox)
    .sort((a,b) => (a.type === b.type ? 0 : a.type === 'folder' ? -1 : 1) || (a.order||0)-(b.order||0) || (b.created||0)-(a.created||0));
}

function streakInfo(){

// in-app history: every move is remembered so "পিছনে" returns to where you were; it also hooks the phone/browser back gesture
const hist = []; let pushed = 0;
function go(view, id, noPush){
  id = id || null;
  if(!noPush && (st.view !== view || (st.id||null) !== id)){
    hist.push({view:st.view, id:st.id||null}); if(hist.length > 60) hist.shift();
    try { history.pushState({hn:1}, ''); pushed++; } catch(e){}
  }
  st.view = view; st.id = id; st.filter = 'all'; closeSheet(); render(); window.scrollTo(0,0);
}
function parentOf(){
  const p = st.id && S.items[st.id];
  if(st.view === 'page') return p && p.inbox ? {view:'inbox'} : {view:'folder', id: p && p.parentId};
  if(st.view === 'folder' && p) return {view:'folder', id: p.parentId};
  if(st.view === 'map') return {view:'maps'};
  return {view:'today'};
}
function goBack(){
  let to = null;
  while(hist.length){ const h = hist.pop(); if(h.view === 'today' || h.view === 'inbox' || !h.id || S.items[h.id] || (S.maps && S.maps[h.id])){ to = h; break; } }
  if(!to) to = parentOf();
  go(to.view, to.id, true);
}

// dashboard: on wide screens drop each card into whichever of two columns is shorter, so neither side is left empty
function balanceDash(){
  const g = $('#dashGrid'); if(!g) return;
  const cards = Array.from(g.querySelectorAll(':scope > .card, :scope > .dash-col > .card'));
  g.querySelectorAll(':scope > .dash-col').forEach(c => c.remove());
  cards.forEach(c => g.appendChild(c));
  if(window.innerWidth < 900) return;
  const cols = [document.createElement('div'), document.createElement('div')]; cols.forEach(c => { c.className = 'dash-col'; });
  const hs = cards.map(c => c.offsetHeight);
  g.appendChild(cols[0]); g.appendChild(cols[1]);
  const h = [0, 0];
  cards.forEach((c, i) => { const k = h[0] <= h[1] ? 0 : 1; cols[k].appendChild(c); h[k] += hs[i] + 12; });
}

const OK_TAGS = {IMG:1,B:1,STRONG:1,I:1,EM:1,U:1,SPAN:1,FONT:1,BR:1,DIV:1,P:1,H3:1,UL:1,OL:1,LI:1};
function cleanHtml(html){
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  const walk = n => { Array.from(n.childNodes).forEach(c => {
    if(c.nodeType === 3) return;
    if(c.nodeType === 1 && c.tagName === 'IMG'){ const src = c.getAttribute('src') || ''; if(!/^\/_blob\/[0-9a-f]{32}$/.test(src) && !/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(src)){ n.removeChild(c); return; } Array.from(c.attributes).forEach(a => c.removeAttribute(a.name)); c.setAttribute('src', src); c.setAttribute('alt', ''); c.setAttribute('loading', 'lazy'); return; }
    if(c.nodeType !== 1 || !OK_TAGS[c.tagName]){ if(c.nodeType === 1 && !/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE)$/.test(c.tagName)){ walk(c); while(c.firstChild) n.insertBefore(c.firstChild, c); } n.removeChild(c); return; }
    const fw = c.style && c.style.fontWeight, fst = c.style && c.style.fontStyle, td = c.style && (c.style.textDecorationLine || c.style.textDecoration) || '';
    const col = c.style && c.style.color, bg = c.style && c.style.backgroundColor, fc = c.tagName === 'FONT' ? c.getAttribute('color') : '';
    Array.from(c.attributes).forEach(a => c.removeAttribute(a.name));
    const okc = v => v && /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\))$/i.test(v.trim());
    if(okc(col) || okc(fc)) c.style.color = okc(col) ? col : fc;
    if(okc(bg)) c.style.backgroundColor = bg;
    if(fw === 'bold' || +fw >= 600) c.style.fontWeight = 'bold';
    if(fst === 'italic') c.style.fontStyle = 'italic';
    if(/underline/.test(td)) c.style.textDecoration = 'underline';
    walk(c); }); };
  walk(t.content);
  return t.innerHTML;
}

/* ---------- images in writing: shrunk in the browser, stored as artifact assets, referenced as /_blob/<id> ---------- */
let assetsCap, imgRange = null;
async function getAssets(){
  if(assetsCap === undefined){ try { assetsCap = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('assets') : null; } catch(e){ assetsCap = null; } }
  return assetsCap;
}
async function shrinkImage(file){
  if(file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, 'image/webp', 0.82));
    return out && out.type === 'image/webp' && out.size < file.size ? out : file;
  } catch(e){ return file; }
}
function saveImgRange(){ const sel = document.getSelection(), b = $('#edBody'); imgRange = sel && sel.rangeCount && b && b.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null; }
async function addImages(files){
  files = Array.from(files || []).filter(f => /^image\/(png|jpeg|webp|gif)$/.test(f.type));
  if(!files.length) return;
  const assets = await getAssets();
  if(!assets && !STANDALONE){ toast('ছবি যোগ করা যাচ্ছে শুধু claude.ai-তে সাইন ইন করা অবস্থায়।'); return; }
  const b = $('#edBody'); if(!b) return;
  toast(files.length > 1 ? bn(files.length)+'টা ছবি তোলা হচ্ছে…' : 'ছবি তোলা হচ্ছে…');
  for(const f of files){
    try {
      const small = await shrinkImage(f);
      let src;
      if(assets){ const r = await assets.upload(small, {type: small.type}); src = '/_blob/'+r.id; }
      else { if(small.size > 3000000) throw {code:'too_large'}; src = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(small); }); }
      b.focus();
      if(imgRange){ const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(imgRange); }
      document.execCommand('insertHTML', false, '<img src="'+src+'" alt=""><br>');
      saveImgRange();
    } catch(e){
      const c = e && e.code;
      toast(c === 'too_large' ? 'ছবিটা অনেক বড়, ছোট করে আবার দিন।' : c === 'quota_or_state' ? 'ছবির জায়গা ভরে গেছে।' : c === 'unsupported_type' ? 'এই ধরনের ছবি নেওয়া যায় না (PNG, JPG, WEBP, GIF দিন)।' : 'ছবি তোলা যায়নি, আবার চেষ্টা করুন।');
      return;
    }
  }
  edDirty(); toast('ছবি যোগ হয়েছে');
}

/* ---------- Finder-style date groups ---------- */
function ageGroups(list){
  const t0 = new Date(); t0.setHours(0,0,0,0); const day = 86400000, T = t0.getTime();
  const label = ts => { if(ts >= T) return 'আজ'; if(ts >= T-day) return 'গতকাল'; if(ts >= T-7*day) return 'গত ৭ দিন'; if(ts >= T-30*day) return 'গত ৩০ দিন';
    const d = new Date(ts); return MONTHS[d.getMonth()]+' '+bn(d.getFullYear()); };
  const sorted = list.slice().sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || (b.created||0)-(a.created||0));
  const groups = []; let cur = null;
  sorted.forEach(p => { const l = p.pinned ? 'পিন করা' : label(p.created||0); if(!cur || cur.l !== l){ cur = {l, ps:[]}; groups.push(cur); } cur.ps.push(p); });
  return groups.map(g => '<div class="agegrp"><div class="agelbl">'+g.l+' <span>'+bn(g.ps.length)+'</span></div><div class="list">'+g.ps.map(p => pageRow(p)).join('')+'</div></div>').join('');
}

function gcalUrl(t){
  const at = t.at || ''; let dates;
  if(at.length > 10){
    const s = at.replace(/[-:]/g,'').slice(0,13) + '00';
    const e = new Date(at); e.setMinutes(e.getMinutes()+30);
    const ee = e.getFullYear()+pad(e.getMonth()+1)+pad(e.getDate())+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';
    dates = s+'/'+ee;
  } else {
    const d = new Date(at+'T00:00'); const n = new Date(d); n.setDate(n.getDate()+1);
    dates = at.replace(/-/g,'')+'/'+dkey(n).replace(/-/g,'');
  }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t.title)+'&dates='+dates+'&ctz=Asia/Dhaka&details='+encodeURIComponent("Hasan's Notebook থেকে")
}

// last 14 days of writing: one bar per day, stacked by top-level folder, so he can see what kind of writing each day held
function topFolder(p){ const c = chain(p); return c.length ? c[0] : null; }
function writingCard(){
  const days = (S.meta.writing && S.meta.writing.days) || {};
  const ps = pages().filter(p => !p.inbox);
  const e = new Date(); e.setHours(0,0,0,0); e.setDate(e.getDate()-13);
  const list = [];
  for(let k = 0; k < 14; k++){ const a = e.getTime(); e.setDate(e.getDate()+1); const b = e.getTime(); const d = new Date(a);
    const made = ps.filter(p => p.created >= a && p.created < b);
    list.push({d, made, wrote: made.length > 0 || !!days[dkey(d)]}); }
  const fmap = {};
  list.forEach(x => x.made.forEach(p => { const f = topFolder(p); const k = f ? f.id : ''; (fmap[k] = fmap[k] || {f, n:0}).n++; }));
  const fl = Object.entries(fmap).sort((a,b) => b[1].n - a[1].n);
  const colorOf = k => k && fmap[k].f ? (fmap[k].f.color || COLORS[6]) : 'var(--faint)';
  const mx = Math.max(1, ...list.map(x => x.made.length));
  const total = list.reduce((n, x) => n + x.made.length, 0), wroteDays = list.filter(x => x.wrote).length;
  const best = list.reduce((m, x) => x.made.length > (m ? m.made.length : 0) ? x : m, null);
  return '<div class="card"><h3>গত ১৪ দিনের লেখা</h3>'+
    '<div class="wsum"><div><b>'+bn(total)+'</b><span>নতুন লেখা</span></div>'+(best ? '<div><b>'+bn(best.made.length)+'</b><span>সবচেয়ে বেশি, '+bn(best.d.getDate())+' '+MONTHS[best.d.getMonth()].slice(0,3)+'</span></div>' : '')+'</div>'+
    '<div class="wbars">'+list.map((x, i) => {
      const segs = {}; x.made.forEach(p => { const f = topFolder(p); const k = f ? f.id : ''; segs[k] = (segs[k]||0) + 1; });
      return '<div title="'+esc(bn(x.d.getDate())+' '+MONTHS[x.d.getMonth()]+': '+bn(x.made.length)+' টা লেখা')+'"><em>'+(x.made.length ? bn(x.made.length) : '')+'</em>'+
        '<span class="stk" style="height:'+(x.made.length/mx*78)+'%">'+Object.keys(segs).map(k => '<i style="flex:'+segs[k]+';background:'+esc(colorOf(k))+'"></i>').join('')+'</span>'+
        '<small'+(i===13?' class="tday"':'')+'>'+(i===13 ? 'আজ' : bn(x.d.getDate()))+'</small></div>'; }).join('')+'</div>'+
    (fl.length ? '<div class="legend">'+fl.map(([k, v]) => '<span><i style="background:'+esc(colorOf(k))+'"></i>'+esc(v.f ? v.f.title : 'ফোল্ডার ছাড়া')+' '+bn(v.n)+'</span>').join('')+'</div>'
      : '<div class="hint">গত ১৪ দিনে নতুন কোনো লেখা নেই।</div>')+
    '<div class="hint">প্রতিটা দাগ একটা দিন, রং দেখায় কোন খাতার লেখা।</div>'+
  '</div>';
}

function videoDoneAt(v){ return v.doneAt || (v.date ? new Date(v.date+'T00:00').getTime() : (v.updated || v.created || 0)); }
function videoStatsCard(){
  const vids = Object.values(S.videos), done = vids.filter(v => v.stage === 'up');
  const now = new Date(), mS = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const going = vids.filter(v => ['script','shoot','edit'].includes(v.stage)).length, ideas = vids.filter(v => (v.stage||'idea') === 'idea').length;
  const months = []; for(let i = 5; i >= 0; i--){ const a = new Date(now.getFullYear(), now.getMonth()-i, 1), b = new Date(a.getFullYear(), a.getMonth()+1, 1); months.push({l: MONTHS[a.getMonth()].slice(0,3), n: done.filter(v => { const t = videoDoneAt(v); return t >= a.getTime() && t < b.getTime(); }).length}); }
  const mx = Math.max(1, ...months.map(m => m.n));
  const rows = (title, key, opts) => { const all = opts.concat([...new Set(vids.map(v => v[key] || null).filter(x => !opts.includes(x)))]); const tmx = Math.max(1, ...all.map(o => vids.filter(v => (v[key]||null) === o).length));
    return '<h4 class="sub">'+title+'</h4>'+all.map(o => { const t = vids.filter(v => (v[key]||null) === o), d = t.filter(v => v.stage === 'up').length; if(!t.length) return '';
      return '<div class="drow"><div class="h"><span>'+esc(o || 'ঠিক করা নেই')+'</span><small>'+bn(d)+' টা শেষ · মোট '+bn(t.length)+'</small></div><div class="sbar"><i style="width:'+(d/tmx*100)+'%;background:var(--teal)"></i><i style="width:'+((t.length-d)/tmx*100)+'%;background:var(--teal-soft)"></i></div></div>'; }).join(''); };
  return '<div class="card"><h3>ভিডিওর হিসাব <button class="link" data-act="go" data-view="videos">পাইপলাইন</button></h3>'+
    '<div class="wsum"><div><b>'+bn(done.length)+'</b><span>মোট শেষ</span></div><div><b>'+bn(done.filter(v => videoDoneAt(v) >= mS).length)+'</b><span>এই মাসে শেষ</span></div><div><b>'+bn(going)+'</b><span>কাজ চলছে</span></div><div><b>'+bn(ideas)+'</b><span>আইডিয়া</span></div></div>'+
    '<h4 class="sub">প্রতি মাসে কয়টা শেষ হলো</h4><div class="mbars" style="height:100px">'+months.map(m => '<div><em>'+(m.n?bn(m.n):'')+'</em><i style="height:'+(m.n/mx*80)+'%;background:var(--teal)"></i><small>'+m.l+'</small></div>').join('')+'</div>'+
    rows('ধরন অনুযায়ী (রিলস, লং ভিডিও…)', 'format', fmts())+

VIEWS.inbox = function(){
  const notes = items().filter(i => isInbox(i) && visible(i)).sort((a,b) => (b.created||0)-(a.created||0));
  return '<div class="wrap narrow">'+
    '<div class="top"><div><div class="eyebrow">চলতে চলতে যা মাথায় আসে</div><div class="h1">দ্রুত নোট</div></div></div>'+
    '<div class="card lift"><div class="capture"><textarea class="field" id="cap" rows="2" data-auto placeholder="আইডিয়াটা লিখে ফেলুন… পরে বড় করে পেজ বানাতে পারবেন"></textarea></div><div class="row"><button class="btn pri" data-act="capNote">'+ic('plus')+'নোট রাখুন</button></div></div>'+

      : '<div class="empty">ইনবক্স খালি। হাঁটতে হাঁটতে মাথায় কিছু এলে এখানে এক লাইনে লিখে রাখুন।</div>')+
  '</div>';
};

VIEWS.folder = function(){
  const f = st.id ? S.items[st.id] : null;
  if(st.id && (!f || trashed(f))){ st.id = null; }
  const ks = kids(st.id);
  const folders = ks.filter(k => k.type === 'folder');
  let ps = ks.filter(k => k.type === 'page');
  if(st.filter !== 'all') ps = ps.filter(p => (p.status||'idea') === st.filter);
  const crumbs = f ? '<div class="crumbs"><button data-act="go" data-view="folder">সব নোট</button>'+chain(f).map(a => '›<button data-act="go" data-view="folder" data-id="'+a.id+'">'+esc(a.title)+'</button>').join('')+'</div>' : '';
  const fl = [['all','সব'],['idea','আইডিয়া'],['draft','ড্রাফট'],['working','চলছে'],['done','সম্পন্ন']];
  return '<div class="wrap">'+crumbs+
    '<div class="top"><div><div class="eyebrow">'+(f ? 'ফোল্ডার' : 'আপনার সব লেখা')+'</div><div class="h1">'+(f ? esc(f.title) : 'লেখার খাতা')+'</div></div>'+
    '<div class="row">'+(f?'<button class="iconbtn" data-act="menu" data-id="'+f.id+'" aria-label="ফোল্ডারের অপশন">'+ic('dots')+'</button>':'')+'<button class="btn" data-act="newFolder" data-parent="'+(st.id||'')+'">'+ic('folder')+'ফোল্ডার</button><button class="btn pri" data-act="newPage" data-parent="'+(st.id||'')+'">'+ic('plus')+'নতুন লেখা</button></div></div>'+
    (folders.length ? '<div class="folders">'+folders.map(x => '<button class="folder" data-act="go" data-view="folder" data-id="'+x.id+'" data-menu="'+x.id+'" data-drag="'+x.id+'" data-dropfolder="'+x.id+'" data-sib="'+(st.id||'')+'"><span class="fi" style="background:'+esc(x.color||COLORS[6])+'">'+ic('folder')+'</span><span style="min-width:0"><b>'+esc(x.title)+'</b><small>'+bn(countIn(x.id))+' টা লেখা</small></span></button>').join('')+'</div>' : '')+
    '<div class="row" style="justify-content:space-between;flex-wrap:wrap"><div class="seg">'+[['date','তারিখ অনুযায়ী'],['manual','নিজে সাজানো']].map(([v,l]) => '<button data-act="fsort" data-v="'+v+'" class="'+(sets().folderSort===v?'on':'')+'">'+l+'</button>').join('')+'</div><div class="chips">'+fl.map(([k,l]) => '<button class="chip'+(st.filter===k?' on':'')+'" data-act="filter" data-f="'+k+'">'+l+'</button>').join('')+'</div></div>'+
    (ps.length ? (sets().folderSort === 'manual'
      ? '<div class="hint">লেখা চেপে ধরে (কম্পিউটারে মাউস দিয়ে টেনে) উপরে-নিচে সরান, বা ফোল্ডারের উপর ছেড়ে দিন।</div><div class="list">'+ps.slice().sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || (a.order||0)-(b.order||0) || (b.created||0)-(a.created||0)).map(p => pageRow(p, {sib: st.id||''})).join('')+'</div>'
      : ageGroups(ps)) : '<div class="empty">'+(st.filter==='all' ? 'এই ফোল্ডারে এখনো লেখা নেই। "নতুন লেখা" চেপে শুরু করুন।' : 'এই ধাপে কোনো লেখা নেই।')+'</div>')+
  '</div>';
};

VIEWS.page = function(){
  const p = S.items[st.id];

  const c = chain(p);
  const opt = (obj, cur, none) => (none?'<option value="">'+none+'</option>':'')+Object.keys(obj).map(k => '<option value="'+k+'"'+(cur===k?' selected':'')+'>'+obj[k]+'</option>').join('');
  return '<div class="wrap narrow" id="editor" data-id="'+p.id+'">'+
    '<div class="row" style="justify-content:space-between">'+
      '<div class="crumbs">'+(p.inbox?'<button data-act="go" data-view="inbox">দ্রুত নোট</button>':'<button data-act="go" data-view="folder">সব নোট</button>'+c.map(a => '›<button data-act="go" data-view="folder" data-id="'+a.id+'">'+esc(a.title)+'</button>').join(''))+'</div>'+
      '<div class="row" style="gap:2px"><button class="iconbtn'+(p.pinned?' on':'')+'" data-act="tog" data-k="pinned" data-id="'+p.id+'" title="পিন" aria-label="পিন">'+ic('pin')+'</button><button class="iconbtn" data-act="menu" data-id="'+p.id+'" aria-label="আরও">'+ic('dots')+'</button></div>'+
    '</div>'+
    (p.inbox ? '<div class="banner" style="background:var(--teal-soft);color:var(--teal)">এটা এখনো দ্রুত নোটে আছে। <button class="btn sm teal" data-act="moveTo" data-id="'+p.id+'" style="margin-left:6px">খাতায় সরান</button></div>' : '')+

      '<label>প্রায়োরিটি<select class="field" id="edPrio">'+opt(PRIO, p.priority, '—')+'</select></label>'+
      '<label>ডেডলাইন<input type="date" class="field" id="edDeadline" value="'+esc(p.deadline||'')+'" style="min-height:38px;padding:5px 8px;font-size:14px"></label>'+

      '<label style="flex:1;min-width:160px">ট্যাগ (কমা দিয়ে)<input class="field" id="edTags" value="'+esc((p.tags||[]).join(', '))+'" placeholder="ইসলাম, জীবন" style="min-height:38px;font-size:14px"></label>'+
    '</div>'+
    fmtBar()+'<div class="ed-body" id="edBody" contenteditable="true" role="textbox" aria-multiline="true" data-ph="লিখতে শুরু করুন…">'+bodyHtml(p)+'</div>'+
    '<div class="ed-foot"><span id="edCount">'+bn(words(p.body))+' শব্দ</span><span>লেখা: '+fmtDate(p.created)+(new Date(p.created).getFullYear()===new Date().getFullYear()?' '+bn(new Date(p.created).getFullYear()):'')+'</span><span id="edSaved">শেষ এডিট '+ago(p.updated)+'</span></div>'+

VIEWS.tasks = function(){
  const all = Object.values(S.tasks);
  const rems = all.filter(t => !t.done && t.at).sort((a,b) => String(a.at).localeCompare(String(b.at)));
  const tab = st.taskTab;
  const open = sortTasks(all.filter(t => !t.done && t.when === tab));
  const done = all.filter(t => t.done && t.when === tab).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));
  const nN = all.filter(t => !t.done && t.when === 'near').length, fN = all.filter(t => !t.done && t.when === 'far').length;
  return '<div class="wrap narrow">'+
    '<div class="top"><div><div class="eyebrow">ছোট বড় সব কাজ, প্রায়োরিটি আর রিমাইন্ডারসহ</div><div class="h1">কাজ</div></div></div>'+
    (rems.length ? '<div class="remind"><h3><span style="display:flex;align-items:center;gap:6px">'+ic('bell').replace('<svg','<svg style="width:20px;height:20px"')+'আসছে রিমাইন্ডার</span><span class="pill" style="background:var(--surface);color:var(--teal)">'+bn(rems.length)+'</span></h3><div class="list">'+rems.slice(0,6).map(taskRow).join('')+'</div></div>' : '')+
    '<div class="seg" role="tablist"><button class="'+(tab==='near'?'on':'')+'" data-act="taskTab" data-t="near">নিকটস্থ ('+bn(nN)+')</button><button class="'+(tab==='far'?'on':'')+'" data-act="taskTab" data-t="far">দূরের ('+bn(fN)+')</button></div>'+
    '<div class="eyebrow">'+(tab==='near' ? 'আজ বা একটু পরে যা করতে হবে' : '২ দিন থেকে ২ সপ্তাহের মধ্যে, যেমন বাজারে গেলে সাবান আনা')+'</div>'+
    '<div class="card lift" id="taskAdd"><input class="field" id="tIn" placeholder="কাজটা লিখুন…" data-enter="addTask">'+
      '<label class="row" style="font-size:14px;color:var(--muted)">প্রায়োরিটি <select class="field" id="tPrio"><option value="urgent">জরুরি</option><option value="high">বেশি</option><option value="medium" selected>মাঝারি</option><option value="low">কম</option></select></label>'+
      '<div class="rem-row"><div class="lbl">'+ic('bell')+'রিমাইন্ডার দেবেন? (ইচ্ছা হলে)</div><div class="chips">'+remChips('tAt', true)+'</div><input type="datetime-local" class="field" id="tAt" aria-label="রিমাইন্ডারের দিন ও সময়" style="min-height:42px;font-size:14px"><div style="font-size:12.5px;color:var(--muted)">সময় দিলে কাজ যোগ করার পর Google Calendar-এ সেভ করার বাটন আসবে। সেখানে Save চাপলেই সময়মতো ফোনে নোটিফিকেশন আসবে।</div></div>'+
      '<button class="btn pri bigbtn" data-act="addTask">'+ic('plus')+'কাজ যোগ করুন</button></div>'+
    (open.length ? '<div class="list">'+open.map(taskRow).join('')+'</div>' : '<div class="empty">কোনো কাজ বাকি নেই।</div>')+
    (done.length ? '<details><summary style="cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0">হয়ে গেছে ('+bn(done.length)+')</summary><div class="list" style="margin-top:6px">'+done.map(taskRow).join('')+'</div><button class="btn sm ghost" data-act="clearDone" style="margin-top:6px">হয়ে যাওয়া কাজগুলো মুছুন</button></details>' : '')+
  '</div>';
};

VIEWS.videos = function(){
  const all = Object.values(S.videos);
  const vids = all.filter(v => (!st.vf || v.format === st.vf) && (!st.vc || v.channel === st.vc)).sort((a,b) => (a.created||0)-(b.created||0));
  const fchips = (key, list, cur) => { const used = list.filter(o => all.some(v => v[key === 'vf' ? 'format' : 'channel'] === o)); if(used.length < 2) return '';
    return '<div class="chips">'+[['','সব']].concat(used.map(o => [o,o])).map(([v,l]) => '<button class="chip'+((cur||'')===v?' on':'')+'" data-act="vFilt" data-k="'+key+'" data-v="'+esc(v)+'">'+esc(l)+'</button>').join('')+'</div>'; };
  const sel = (id, arr) => '<select class="field" id="'+id+'">'+arr.map(x => '<option>'+x+'</option>').join('')+'</select>';
  return '<div class="wrap" style="max-width:1100px">'+
    '<div class="top"><div><div class="eyebrow">প্রতিটা ভিডিও কোন ধাপে আছে</div><div class="h1">কনটেন্ট পাইপলাইন</div></div></div>'+
    '<div class="card lift"><input class="field" id="vIn" placeholder="নতুন ভিডিও আইডিয়া…" data-enter="addVideo"><div class="row">'+sel('vCh',chans())+sel('vFm',fmts())+'<button class="btn pri" data-act="addVideo">'+ic('plus')+'যোগ</button></div></div>'+
    fchips('vf', fmts(), st.vf)+fchips('vc', chans(), st.vc)+
    '<div class="board-scroll"><div class="board">'+STAGES.map(([k,l]) => { const vs = vids.filter(v => (v.stage||'idea') === k).sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0)); return '<div class="col"><h4><span>'+l+'</span><span style="color:var(--faint)">'+bn(vs.length)+'</span></h4>'+vs.map(v => '<div class="vwrap"><button class="vpin'+(v.pinned?' on':'')+'" data-act="vPin" data-id="'+v.id+'" title="'+(v.pinned?'পিন সরান':'পিন করুন')+'" aria-label="পিন">'+ic('pin')+'</button><button class="vcard'+(v.pinned?' pinned':'')+'" data-act="video" data-id="'+v.id+'"><b>'+esc(v.title)+'</b><span class="meta" style="display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)">'+esc(v.channel||'')+(v.format?' · '+esc(v.format):'')+(v.date?' · '+fmtDate(new Date(v.date+'T00:00')):'')+(v.pageId&&S.items[v.pageId]?' · লেখা আছে':'')+'</span></button></div>').join('')+'</div>'; }).join('')+'</div></div>'+
  '</div>';
};

VIEWS.timeline = function(){
  // collect dated events
  const ev = {};
  const add = (key, e) => { (ev[key] = ev[key] || []).push(e); };
  items().filter(i => i.type === 'page' && !trashed(i)).forEach(p => add(dkey(new Date(p.created)), {k:'page', p}));
  Object.values(S.daily).forEach(d => (d.lines||[]).forEach(l => add(d.id, {k:'log', l})));
  Object.values(S.videos).filter(v => v.date).forEach(v => add(v.date, {k:'video', v}));
  Object.values(S.tasks).filter(t => t.done && t.doneAt).forEach(t => add(dkey(new Date(t.doneAt)), {k:'task', t}));
  const keys = Object.keys(ev).sort().reverse();
  const years = [...new Set(keys.map(k => k.slice(0,4)))];
  const now = new Date();
  const y = st.year || (years[0] || String(now.getFullYear()));
  const months = [...new Set(keys.filter(k => k.startsWith(y)).map(k => k.slice(5,7)))].sort().reverse();
  const m = st.month && months.includes(st.month) ? st.month : (months[0] || pad(now.getMonth()+1));
  const shown = keys.filter(k => k.startsWith(y+'-'+m));
  return '<div class="wrap narrow">'+
    '<div class="top"><div><div class="eyebrow">বছর › মাস › দিন</div><div class="h1">টাইমলাইন</div></div></div>'+
    '<div class="chips">'+(years.length?years:[y]).map(x => '<button class="chip'+(x===y?' on':'')+'" data-act="tlYear" data-y="'+x+'">'+bn(x)+'</button>').join('')+'</div>'+
    '<div class="chips">'+(months.length?months:[m]).map(x => '<button class="chip'+(x===m?' on':'')+'" data-act="tlMonth" data-m="'+x+'">'+MONTHS[+x-1]+'</button>').join('')+'</div>'+
    (shown.length ? shown.map(k => { const d = new Date(k+'T00:00'); return '<div class="tl-day"><div class="tl-date"><b>'+bn(d.getDate())+'</b><small>'+DAYS[d.getDay()]+'</small></div><div class="list">'+ev[k].map(e =>
      e.k === 'page' ? pageRow(e.p, {time:'created'}) :
      e.k === 'log' ? '<div class="item"><span class="pill" style="background:var(--teal-soft);color:var(--teal)">আপডেট</span><span style="flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere">'+esc(e.l.text)+'</span><small style="color:var(--faint)">'+fmtTime(e.l.t)+'</small></div>' :
      e.k === 'video' ? '<button class="item" data-act="video" data-id="'+e.v.id+'" style="text-align:left;width:100%"><span class="pill p-high">ভিডিও</span><span style="flex:1;min-width:0;font-size:14px">'+esc(e.v.title)+'</span><span class="pill">'+(STAGES.find(s=>s[0]===(e.v.stage||'idea'))||STAGES[0])[1]+'</span></button>' :
      '<div class="item"><span class="pill s-done">কাজ শেষ</span><span style="flex:1;min-width:0;font-size:14px">'+esc(e.t.title)+'</span></div>').join('')+'</div></div>'; }).join('')
      : '<div class="empty">এই মাসে এখনো কিছু নেই। লেখা, দিনের আপডেট, শেষ করা কাজ আর ভিডিওর তারিখ এখানে দিন ধরে জমা হবে।</div>')+
  '</div>';
};

VIEWS.maps = function(){
  const ms = Object.values(S.maps).sort((a,b) => (b.updated||0)-(a.updated||0));
  return '<div class="wrap narrow">'+
    '<div class="top"><div><div class="eyebrow">একটা আইডিয়া থেকে ডালপালা</div><div class="h1">মাইন্ড ম্যাপ</div></div><button class="btn pri" data-act="newMap">'+ic('plus')+'নতুন ম্যাপ</button></div>'+

VIEWS.map = function(){
  const m = S.maps[st.id];
  if(!m){ st.view = 'maps'; return VIEWS.maps(); }
  const nodes = m.nodes || [];
  const byParent = {}; nodes.forEach(n => { (byParent[n.parent||''] = byParent[n.parent||''] || []).push(n); });
  const root = nodes.find(n => !n.parent) || nodes[0];
  const pos = {}; let leaf = 0; const W = 190, H = 54;
  const lay = (n, depth) => { const ch = byParent[n.id] || []; if(!ch.length){ pos[n.id] = {x:depth, y:leaf++}; } else { ch.forEach(c => lay(c, depth+1)); const ys = ch.map(c => pos[c.id].y); pos[n.id] = {x:depth, y:(Math.min(...ys)+Math.max(...ys))/2}; } };
  if(root) lay(root, 0);
  const maxX = Math.max(0, ...Object.values(pos).map(p => p.x));
  const w = (maxX+1)*W + 40, h = Math.max(1, leaf)*H + 40;
  const P = id => ({x: 20 + pos[id].x*W, y: 20 + pos[id].y*H});
  const label = t => { t = String(t||''); return t.length > 16 ? t.slice(0,15)+'…' : t; };
  let links = '', boxes = '';
  nodes.forEach(n => {
    if(!pos[n.id]) return;
    const a = P(n.id);
    if(n.parent && pos[n.parent]){ const b = P(n.parent); links += '<path class="mm-link" d="M'+(b.x+160)+' '+(b.y+18)+' C'+(b.x+175)+' '+(b.y+18)+' '+(a.x-15)+' '+(a.y+18)+' '+a.x+' '+(a.y+18)+'"/>'; }
    boxes += '<g class="mm-node'+(n===root?' root':'')+'" data-act="mmNode" data-id="'+n.id+'" tabindex="0" role="button" aria-label="'+esc(n.text)+'"><rect x="'+a.x+'" y="'+a.y+'" width="160" height="36" rx="10"/><text x="'+(a.x+12)+'" y="'+(a.y+23)+'">'+esc(label(n.text))+'</text></g>';
  });
  return '<div class="wrap">'+
    '<div class="crumbs"><button data-act="go" data-view="maps">মাইন্ড ম্যাপ</button></div>'+
    '<div class="top"><div class="h1">'+esc(root ? root.text : 'ম্যাপ')+'</div><div class="row"><button class="btn sm" data-act="delMap" data-id="'+m.id+'">'+ic('trash')+'ম্যাপ মুছুন</button></div></div>'+
    '<div class="eyebrow">যেকোনো ভাবনায় চাপুন: নতুন ডাল যোগ, নাম বদল বা মুছে ফেলা।</div>'+
    '<div class="mm-wrap"><svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+links+boxes+'</svg></div>'+
  '</div>';
};

const LISTS = {
  pinned:['পিন করা', p => p.pinned, 'edited'], fav:['প্রিয়', p => p.fav, 'edited'],
  opened:['সম্প্রতি খোলা', p => p.opened, 'opened'], edited:['সম্প্রতি এডিট', () => true, 'edited'], created:['নতুন তৈরি', () => true, 'created'],
  draft:['ড্রাফট', p => p.status === 'draft', 'edited'], working:['চলমান লেখা', p => p.status === 'working', 'edited'],
  deadline:['ডেডলাইন আছে', p => p.deadline && p.status !== 'done', 'deadline'],
  archive:['আর্কাইভ', null, 'edited'], trash:['ট্র্যাশ', null, 'edited']
};
const SHOWN_LISTS = ['opened','pinned','archive','trash'];
VIEWS.list = function(){
  const L = LISTS[st.id] || LISTS.edited;
  let arr;
  if(st.id === 'trash') arr = items().filter(i => i.trashedAt).sort((a,b) => b.trashedAt-a.trashedAt);
  else if(st.id === 'archive') arr = items().filter(i => i.archived && !trashed(i));
  else arr = pages().filter(L[1]);
  const t = L[2];
  if(t === 'opened') arr.sort((a,b) => (b.opened||0)-(a.opened||0));
  else if(t === 'created') arr.sort((a,b) => (b.created||0)-(a.created||0));
  else if(t === 'deadline') arr.sort((a,b) => String(a.deadline).localeCompare(String(b.deadline)));
  else arr.sort((a,b) => (b.updated||0)-(a.updated||0));
  arr = arr.slice(0, 200);
  const row = i => i.type === 'folder'
    ? '<div class="item" data-menu="'+i.id+'"><span class="dot" style="background:'+esc(i.color||COLORS[6])+'"></span><button class="main-hit" data-act="go" data-view="folder" data-id="'+i.id+'"><span class="t">'+esc(i.title)+'</span><span class="meta">ফোল্ডার</span></button><button class="iconbtn" data-act="menu" data-id="'+i.id+'" aria-label="আরও">'+ic('dots')+'</button></div>'
    : pageRow(i, {time: t === 'deadline' ? 'edited' : t, sn: t === 'deadline' ? 'ডেডলাইন: '+fmtDate(new Date(i.deadline+'T00:00')) : null});
  return '<div class="wrap narrow"><div class="top"><div class="h1">'+L[0]+'</div>'+(st.id==='trash'&&arr.length?'<button class="btn sm" data-act="emptyTrash">ট্র্যাশ খালি করুন</button>':'')+'</div>'+
    (st.id === 'trash' ? '<div class="eyebrow">ট্র্যাশের লেখা ⋯ মেনু থেকে ফেরত আনা যায়।</div>' : '')+

const SCOL = {idea:'var(--faint)', draft:'var(--med)', working:'var(--accent)', done:'var(--teal)'};
VIEWS.dash = function(){
  const off = sets().dashOff || {}, on = k => !off[k];
  const ps = pages().filter(p => !p.inbox);
  const now = new Date(), mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const tasks = Object.values(S.tasks), open = tasks.filter(t => !t.done);
  const statusOf = p => SCOL[p.status] ? p.status : 'idea';
  const bar = arr => { const tot = arr.length || 1; return '<div class="sbar">'+Object.keys(SCOL).map(k => { const n = arr.filter(p => statusOf(p) === k).length; return n ? '<i style="width:'+(n/tot*100)+'%;background:'+SCOL[k]+'"></i>' : ''; }).join('')+'</div>'; };
  const legend = arr => '<div class="legend">'+Object.keys(SCOL).map(k => '<span><i style="background:'+SCOL[k]+'"></i>'+STATUS[k]+' '+bn(arr.filter(p => statusOf(p) === k).length)+'</span>').join('')+'</div>';
  const inFolder = fid => { const out = []; const walk = id => kids(id).forEach(k => k.type === 'page' ? out.push(k) : walk(k.id)); walk(fid); return out; };
  const folders = kids(null).filter(k => k.type === 'folder').map(f => ({f, ps: inFolder(f.id)})).filter(x => x.ps.length);
  const months = []; for(let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1), e = new Date(d.getFullYear(), d.getMonth()+1, 1); months.push({l: MONTHS[d.getMonth()].slice(0,3), n: ps.filter(p => p.created >= d.getTime() && p.created < e.getTime()).length}); }
  const mx = Math.max(1, ...months.map(m => m.n));
  const vids = Object.values(S.videos), vmx = Math.max(1, ...STAGES.map(([k]) => vids.filter(v => (v.stage||'idea') === k).length));
  const tline = (l, arr) => { const d = arr.filter(t => t.done).length; return '<div class="drow"><div class="h"><span>'+l+'</span><small>'+bn(d)+' / '+bn(arr.length)+' হয়েছে</small></div><div class="sbar"><i style="width:'+(arr.length ? d/arr.length*100 : 0)+'%;background:var(--teal)"></i></div></div>'; };
  const working = ps.filter(p => p.status === 'working');
  return '<div class="wrap">'+
    '<div class="top"><div><div class="eyebrow">কোথায় কতটুকু এগোল</div><div class="h1">ড্যাশবোর্ড</div></div></div>'+
    (on('tiles') ? '<div class="dash-tiles">'+
      '<div class="tile"><b>'+bn(ps.length)+'</b><span>মোট লেখা</span></div>'+
      '<div class="tile"><b>'+bn(ps.filter(p => p.created >= mStart).length)+'</b><span>এই মাসে নতুন লেখা</span></div>'+
      '<div class="tile"><b>'+bn(open.length)+'</b><span>বাকি কাজ</span></div>'+
      '<div class="tile"><b>'+bn(Object.values(S.videos).filter(v => v.stage === 'up').length)+'</b><span>ভিডিও শেষ হয়েছে</span></div>'+
    '</div>' : '')+
    '<div class="dash-grid" id="dashGrid">'+
      (on('status') ? '<div class="card"><h3>সব লেখার অবস্থা</h3>'+bar(ps)+legend(ps)+'</div>' : '')+
      (!on('folders') ? '' : '<div class="card"><h3>ফোল্ডার অনুযায়ী</h3>'+folders.map(x => '<button class="drow" data-act="go" data-view="folder" data-id="'+x.f.id+'"><div class="h"><span><span style="background:'+esc(x.f.color||COLORS[6])+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px"></span>'+esc(x.f.title)+'</span><small>'+bn(x.ps.length)+' টা · '+bn(x.ps.filter(p => statusOf(p) === 'done').length)+' সম্পন্ন</small></div>'+bar(x.ps)+'</button>').join('')+'</div>')+
      (working.length && on('working') ? '<div class="card"><h3>যেগুলোর কাজ চলছে</h3>'+working.map(p => '<button class="drow" data-act="open" data-id="'+p.id+'"><div class="h"><span>'+esc(p.title||'শিরোনামহীন')+'</span><small>'+bn(+p.progress||0)+'%</small></div><div class="sbar"><i style="width:'+(+p.progress||0)+'%;background:var(--accent)"></i></div></button>').join('')+'</div>' : '')+
      (on('months') ? '<div class="card"><h3>প্রতি মাসে কত লেখা</h3><div class="mbars">'+months.map(m => '<div><em>'+(m.n?bn(m.n):'')+'</em><i style="height:'+(m.n/mx*80)+'%"></i><small>'+m.l+'</small></div>').join('')+'</div></div>' : '')+
      (on('writing') ? streakCard() : '')+
      (on('tasks') ? '<div class="card"><h3>কাজ</h3>'+tline('নিকটস্থ কাজ', tasks.filter(t => t.when === 'near'))+tline('দূরের কাজ', tasks.filter(t => t.when !== 'near'))+'</div>' : '')+
      (on('videos') ? videoStatsCard() : '')+
    '</div>'+
  '</div>';
};

/* ---------- search ---------- */
function lev(a, b){ if(Math.abs(a.length-b.length) > 2) return 9; const m = a.length, n = b.length; let prev = Array.from({length:n+1}, (_,j) => j); for(let i=1;i<=m;i++){ const cur = [i]; for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev = cur; } return prev[n]; }
function norm(s){ return String(s||'').toLowerCase(); }
function matchScore(text, toks, phrase){
  const T = norm(text); if(!T) return {s:0, hits:[]};
  let s = T.includes(phrase) ? 20 : 0; const hits = [];
  let wordsArr = null;
  for(const tk of toks){
    if(T.includes(tk)){ s += 10; hits.push(tk); continue; }
    if(tk.length < 4) return null;
    wordsArr = wordsArr || T.split(/[\s,.।!?;:()"'\-]+/);
    const lim = tk.length >= 7 ? 2 : 1;
    const w = wordsArr.find(w => w.length >= 3 && lev(w, tk) <= lim);
    if(w){ s += 5; hits.push(w); } else return null;
  }
  return {s, hits};
}
function hl(text, hits){
  let out = esc(text);
  [...new Set(hits)].filter(h => h.length).sort((a,b) => b.length-a.length).forEach(h => {
    const re = new RegExp(esc(h).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
    out = out.replace(re, x => '<mark>'+x+'</mark>');
  });
  return out.replace(/<mark>([^<]*)<mark>/g,'<mark>$1').replace(/<\/mark>([^<]*)<\/mark>/g,'$1</mark>');
}
function around(body, hit){ const B = String(body||''); const i = norm(B).indexOf(hit); if(i < 0) return snippet(B); const s = Math.max(0, i-50); return (s?'…':'')+B.slice(s, i+90).replace(/\s+/g,' ')+'…'; }
let sFilter = 'all';
function runSearch(q){
  const box = $('#sRes'); if(!box) return;
  const phrase = norm(q).trim(); const toks = phrase.split(/\s+/).filter(Boolean);
  if(!toks.length){ box.innerHTML = '<div class="empty">শিরোনাম, লেখার ভেতরের শব্দ, ট্যাগ, ফোল্ডার, স্ট্যাটাস বা প্রায়োরিটি লিখুন। একটু ভুল বানানেও খুঁজে দেবে।</div>'; return; }
  const res = [];
  if(sFilter === 'all' || sFilter === 'page'){
    items().filter(i => !trashed(i)).forEach(i => {
      const meta = [(i.tags||[]).join(' '), chain(i).map(a=>a.title).join(' '), i.type==='page' ? (STATUS[i.status||'idea']+' '+(PRIO[i.priority]||'')) : 'ফোল্ডার', i.inbox?'দ্রুত নোট ইনবক্স':''].join(' ');
      const t = matchScore(i.title, toks, phrase), all = matchScore((i.title||'')+' '+(i.body||'')+' '+meta, toks, phrase);
      if(!all) return;
      res.push({k:'page', i, s: all.s + (t ? t.s*2 : 0) + (i.pinned?3:0), hits: all.hits});
    });
  }
  if(sFilter === 'all' || sFilter === 'task'){
    Object.values(S.tasks).forEach(t => { const r = matchScore(t.title+' '+(PRIO[t.priority]||'')+' '+(t.when==='near'?'নিকটস্থ':'দূরের'), toks, phrase); if(r) res.push({k:'task', t, s:r.s, hits:r.hits}); });
  }
  if(sFilter === 'all' || sFilter === 'video'){
    Object.values(S.videos).forEach(v => { const r = matchScore(v.title+' '+(v.notes||'')+' '+(v.channel||'')+' '+(v.format||''), toks, phrase); if(r) res.push({k:'video', v, s:r.s, hits:r.hits}); });
  }
  res.sort((a,b) => b.s-a.s);
  const top = res.slice(0, 40);
  if(!top.length){ box.innerHTML = '<div class="empty">"'+esc(q)+'" দিয়ে কিছু পাওয়া যায়নি।</div>'; return; }
  box.innerHTML = '<div class="res-group">'+bn(res.length)+' টা ফল</div><div class="list">'+top.map(r => {
    if(r.k === 'page'){
      const i = r.i;
      if(i.type === 'folder') return '<div class="item"><span class="dot" style="background:'+esc(i.color||COLORS[6])+'"></span><button class="main-hit" data-act="go" data-view="folder" data-id="'+i.id+'"><span class="t">'+hl(i.title, r.hits)+'</span><span class="meta">ফোল্ডার</span></button></div>';
      const hit = r.hits.find(h => norm(i.body).includes(h));
      return pageRow(i, {hl: t => hl(t, r.hits), sn: hit ? hl(around(i.body, hit), r.hits) : (i.body ? esc(snippet(i.body)) : '')});
    }
    if(r.k === 'task') return '<div class="item"><span class="pill">'+(r.t.when==='near'?'নিকটস্থ':'দূরের')+' কাজ</span><button class="main-hit" data-act="taskMenu" data-id="'+r.t.id+'"><span class="t'+(r.t.done?' done-t':'')+'">'+hl(r.t.title, r.hits)+'</span></button></div>';
    return '<div class="item"><span class="pill p-high">ভিডিও</span><button class="main-hit" data-act="video" data-id="'+r.v.id+'"><span class="t">'+hl(r.v.title, r.hits)+'</span><span class="meta">'+(STAGES.find(s=>s[0]===(r.v.stage||'idea'))||STAGES[0])[1]+'</span></button></div>';
  }).join('')+'</div>';
}

async function offerFile(name, data){
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(!dl){
      const file = new File([data], name, {type: /\.json$/.test(name) ? 'application/json' : 'text/markdown'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try { await navigator.share({files:[file], title:name}); } catch(e){ if(e && e.name === 'AbortError') return; throw e; }
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
      }
      if(/\.json$/.test(name)){ tryLS('hasan-notebook-lastExport', Date.now()); scheduleRender(); }
      toast('ব্যাকআপ ফাইল তৈরি হয়েছে');
      return;
    }
    await dl.save({filename:name, data});
    toast('ফাইল নামানো হয়েছে');
  } catch(e){ if(e && e.code === 'declined') return; toast('ফাইল নামানো যায়নি।'); }
}

async function backupToDrive(manual){
  if(drv.busy) return;
  const mcp = await getMcp();
  if(!mcp){ drv.status = 'error'; drv.msg = 'এখান থেকে Drive-এ যাওয়া যাচ্ছে না। claude.ai-তে অ্যাপটা খুলে চেষ্টা করুন।'; refreshDriveUI(); return; }
  drv.busy = true; drv.status = 'working'; drv.msg = ''; refreshDriveUI();
  try {
    const m = Object.assign({files:{}}, driveMeta()); m.files = Object.assign({}, m.files);
    if(!m.folderId){
      const f = payloadOf(await mcp.callTool(DRIVE, 'create_file', {title:"Hasan's Notebook Backup", contentMimeType:'application/vnd.google-apps.folder'}));
      if(!f.id) throw {code:'tool_error'};
      m.folderId = f.id; put('meta', 'drive', Object.assign({}, m), true);
    }
    const key = dkey(), old = m.files[key];
    drv.dirty = false;
    const r = payloadOf(await mcp.callTool(DRIVE, 'create_file', {title:'hasans-notebook-'+key+'.json', parentId:m.folderId, contentMimeType:'application/json', disableConversionToGoogleType:true, textContent:JSON.stringify(exportAll())}));
    if(!r.id) throw {code:'tool_error'};
    m.files[key] = r.id; m.lastAt = Date.now(); m.lastUrl = r.viewUrl || ''; if(m.auto === undefined) m.auto = true;
    put('meta', 'drive', m, true);
    drv.status = 'idle'; drv.msg = '';
    if(manual) toast('Drive-এ ব্যাকআপ হয়েছে');
    if(old && old !== r.id){ try { await mcp.callTool(DRIVE, 'trash_file', {fileId:old}); } catch(e){} }
  } catch(e){
    drv.dirty = true; drv.status = 'error';
    const code = e && e.code;
    drv.msg = DRIVE_ERR[code] || 'Drive-এ ব্যাকআপ হয়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।';
    if(code === 'declined' || code === 'approval_required') drv.status = 'needs';
  }
  drv.busy = false; refreshDriveUI();
}
function refreshDriveUI(){ renderSide(); if(st.view === 'backup' || st.view === 'today') render(); }
async function driveOnLoad(){
  if(driveChecked || !ready.meta || !ready.items) return;

  const p = await drivePerm();
  if(p === 'prompt' || p === 'denied'){ drv.status = 'needs'; drv.msg = 'এই ডিভাইসে Drive ব্যাকআপ চালু রাখতে একবার "এখনই Drive-এ ব্যাকআপ" চাপুন।'; refreshDriveUI(); return; }
  if(p !== 'granted') return;
  const newest = Math.max(0, ...COLS.map(c => Math.max(0, ...Object.values(S[c]).map(d => +(d.updated || d.created || 0) || 0))));

}

    closeSheet(); openPage(pid); },
  delVideo: d => { remove('videos', d.id); closeSheet(); toast('ভিডিও মুছে ফেলা হয়েছে'); },
  tlYear: d => { st.year = d.y; st.month = null; render(); },
  tlMonth: d => { st.month = d.m; render(); },
  newMap: () => askText('মাঝখানের মূল ভাবনা কী?', '', 'mkMap'),
  mkMap: () => { const v = ($('#askIn')||{}).value; if(!v || !v.trim()) return; const id = uid(); put('maps', id, {nodes:[{id:'r', text:v.trim(), parent:null}], updated:Date.now()}); closeSheet(); go('map', id); },
  mmNode: d => { const m = S.maps[st.id]; const n = m && m.nodes.find(x => x.id === d.id); if(!n) return; openSheet('<h3>'+esc(n.text)+'</h3><input class="field" id="askIn" placeholder="নতুন ডাল (এর নিচে)" data-enter="mmAdd" data-id="'+d.id+'"><div class="row"><button class="btn pri" data-act="mmAdd" data-id="'+d.id+'">'+ic('plus')+'ডাল যোগ</button><button class="btn" data-act="mmRename" data-id="'+d.id+'">নাম বদলান</button>'+(n.parent?'<button class="btn ghost" style="color:var(--urgent)" data-act="mmDel" data-id="'+d.id+'">মুছুন</button>':'')+'</div>'); },
  mmAdd: d => { const v = ($('#askIn')||{}).value; if(!v || !v.trim()) return; const m = S.maps[st.id]; put('maps', st.id, {nodes: m.nodes.concat([{id:uid(), text:v.trim(), parent:d.id}]), updated:Date.now()}); const i = $('#askIn'); i.value=''; i.focus(); },
  mmRename: d => { const m = S.maps[st.id]; const n = m.nodes.find(x => x.id === d.id); askText('নতুন নাম', n.text, 'mmDoRename', ' data-id="'+d.id+'"'); },
  mmDoRename: d => { const v = ($('#askIn')||{}).value; if(!v) return; const m = S.maps[st.id]; put('maps', st.id, {nodes: m.nodes.map(x => x.id === d.id ? Object.assign({}, x, {text:v.trim()}) : x), updated:Date.now()}); closeSheet(); },
  mmDel: d => { const m = S.maps[st.id]; const gone = new Set([d.id]); let grew = true; while(grew){ grew = false; m.nodes.forEach(x => { if(x.parent && gone.has(x.parent) && !gone.has(x.id)){ gone.add(x.id); grew = true; } }); } put('maps', st.id, {nodes: m.nodes.filter(x => !gone.has(x.id)), updated:Date.now()}); closeSheet(); },
  delMap: d => openSheet('<h3>ম্যাপটা মুছবেন?</h3><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="close">বাতিল</button><button class="btn" style="background:var(--urgent);border-color:var(--urgent);color:#fff" data-act="doDelMap" data-id="'+d.id+'">মুছুন</button></div>'),
  doDelMap: d => { remove('maps', d.id); closeSheet(); go('maps'); },
  sFilter: (d, el) => { sFilter = d.f; document.querySelectorAll('[data-act="sFilter"]').forEach(b => b.classList.toggle('on', b === el)); runSearch($('#sIn').value); },
  exportJson: () => offerFile('hasans-notebook-'+dkey()+'.json', JSON.stringify(exportAll(), null, 1)),
  exportMd: () => {
    let md = "# Hasan's Notebook\n\n";
    const walk = (pid, depth) => kids(pid).forEach(k => { if(k.type === 'folder'){ md += '#'.repeat(Math.min(depth+2, 6))+' '+k.title+'\n\n'; walk(k.id, depth+1); } else { md += '#'.repeat(Math.min(depth+2, 6))+' '+(k.title||'শিরোনামহীন')+'\n\n'+(k.body||'')+'\n\n'; } });
    walk(null, 0);
    const inbox = items().filter(i => isInbox(i) && visible(i));
    if(inbox.length) md += '## দ্রুত নোট\n\n'+inbox.map(i => '- '+i.title+(i.body?' — '+i.body:'')).join('\n')+'\n';
    offerFile('hasans-notebook-'+dkey()+'.md', md);
  }
};
function renderForce(){ const ae = document.activeElement; if(ae && ae.blur) ae.blur(); render(); }

/* ---------- editor saving ---------- */
let saveT = null, pendingEd = null;
function edSave(){
  const ed = $('#editor'); if(!ed) return;
  const id = ed.dataset.id; if(!S.items[id]) return;
  const tags = $('#edTags').value.split(/[,،]/).map(s => s.trim()).filter(Boolean);
  const body = edText();
  let html = cleanHtml($('#edBody').innerHTML);
  if(!/<(b|strong|i|em|u|span|font|h3|ul|ol|img)\b/i.test(html)) html = null;
  const before = S.items[id];
  const changes = {title:$('#edTitle').value, body, status:$('#edStatus').value, priority:$('#edPrio').value || null, deadline:$('#edDeadline').value || null, progress:+$('#edProgress').value, tags, html};
  const same = (a, b) => JSON.stringify(a == null ? null : a) === JSON.stringify(b == null ? null : b);
  if(Object.keys(changes).every(k => k === 'status' ? (before.status||'idea') === changes.status : k === 'progress' ? (+before.progress||0) === changes.progress : k === 'tags' ? same(before.tags||[], tags) : k === 'html' ? (before.html||null) === html : k === 'title' || k === 'body' ? (before[k]||'') === changes[k] : same(before[k], changes[k]))) return;
  changes.updated = Date.now();
  if(changes.status === 'done' && !before.completedAt) changes.completedAt = Date.now();
  if(changes.status === 'done' && (before.status||'idea') !== 'done') autoLog('✓ লেখা সম্পন্ন: '+(changes.title||'শিরোনামহীন'), 'p-'+id);
  patch('items', id, changes);
  if(body !== before.body) markWrote();
  const s = $('#edSaved'); if(s) s.textContent = 'সেভ হয়েছে';
}
function edDirty(){ clearTimeout(saveT); const s = $('#edSaved'); if(s) s.textContent = 'লেখা হচ্ছে…'; const c = $('#edCount'); if(c) c.textContent = bn(words(edText()))+' শব্দ'; saveT = setTimeout(edSave, 700); }

/* ---------- drag to move / reorder (Finder style) ---------- */
const dg = {el:null, id:null, sx:0, sy:0, on:false, timer:null, ghost:null, tgt:null, touch:false, swallow:false};
function dgClear(){ document.querySelectorAll('.drop-in,.drop-before,.drop-after').forEach(e => e.classList.remove('drop-in','drop-before','drop-after')); }
function dgOkInto(fid){ const it = S.items[dg.id]; if(!it) return false; if(fid === dg.id) return false; if((it.parentId||'') === (fid||'') && !it.inbox) return false; if(fid && S.items[fid] && chain(S.items[fid]).some(a => a.id === dg.id)) return false; return true; }
function dgStart(){ const it = S.items[dg.id]; if(!it){ dg.el = null; return; } dg.on = true; dg.ghost = document.createElement('div'); dg.ghost.className = 'dghost'; dg.ghost.textContent = it.title || 'শিরোনামহীন'; document.body.appendChild(dg.ghost); dg.el.classList.add('dragging'); try { navigator.vibrate && navigator.vibrate(15); } catch(e){} }
function dgMove(x, y){
  dg.ghost.style.transform = 'translate('+(x+14)+'px,'+(y+10)+'px)'; dgClear(); dg.tgt = null;
  const under = document.elementFromPoint(x, y); if(!under) return;
  const row = under.closest('[data-drag]'), fold = under.closest('[data-dropfolder]');
  if(row && row !== dg.el){
    const r = row.getBoundingClientRect(), rel = (y - r.top) / r.height;
    const isF = row.hasAttribute('data-dropfolder'), canSort = row.dataset.sib != null && row.dataset.sib === dg.el.dataset.sib && row.parentElement === dg.el.parentElement;
    if(isF && (!canSort || (rel > .25 && rel < .75))){ if(dgOkInto(row.dataset.dropfolder)){ dg.tgt = {type:'in', fid:row.dataset.dropfolder}; row.classList.add('drop-in'); } return; }
    if(canSort){ const after = rel >= .5; dg.tgt = {type:'sort', row, after}; row.classList.add(after ? 'drop-after' : 'drop-before'); return; }
  }
  if(fold && fold !== dg.el && dgOkInto(fold.dataset.dropfolder)){ dg.tgt = {type:'in', fid:fold.dataset.dropfolder}; fold.classList.add('drop-in'); }
}
function dgEnd(cancel){
  clearTimeout(dg.timer);
  if(dg.on){
    const t = cancel ? null : dg.tgt, el = dg.el, id = dg.id;
    dgClear(); dg.ghost && dg.ghost.remove(); el && el.classList.remove('dragging');
    dg.swallow = true; setTimeout(() => { dg.swallow = false; }, 80);
    if(t && t.type === 'in'){ patch('items', id, {parentId: t.fid || null, inbox:false}); toast('সরানো হয়েছে'); }
    else if(t && t.type === 'sort'){
      const ids = Array.from(t.row.parentElement.children).filter(e => e.dataset && e.dataset.drag && e.dataset.sib === el.dataset.sib).map(e => e.dataset.drag).filter(x => x !== id);
      ids.splice(ids.indexOf(t.row.dataset.drag) + (t.after ? 1 : 0), 0, id);
      ids.forEach((x, i) => { if(S.items[x] && S.items[x].order !== (i+1)*10) patch('items', x, {order:(i+1)*10}); });
    }
  }
  dg.on = false; dg.el = null; dg.id = null; dg.ghost = null; dg.tgt = null;
}
document.addEventListener('pointerdown', ev => {
  if(ev.button) return;
  const el = ev.target.closest && ev.target.closest('[data-drag]');
  if(!el || ev.target.closest('input,textarea,select,[contenteditable]')) return;
  dg.el = el; dg.id = el.dataset.drag; dg.sx = ev.clientX; dg.sy = ev.clientY; dg.touch = ev.pointerType !== 'mouse'; dg.on = false;
  clearTimeout(dg.timer);
  if(dg.touch) dg.timer = setTimeout(() => { if(dg.el){ dgStart(); if(dg.on) dgMove(dg.sx, dg.sy); } }, 450);
});
document.addEventListener('pointermove', ev => {
  if(!dg.el) return;
  const far = Math.abs(ev.clientX - dg.sx) + Math.abs(ev.clientY - dg.sy) > 8;
  if(!dg.on){ if(dg.touch){ if(far){ clearTimeout(dg.timer); dg.el = null; } return; } if(!far) return; dgStart(); if(!dg.on) return; }
  ev.preventDefault(); dgMove(ev.clientX, ev.clientY);
});
document.addEventListener('touchmove', ev => { if(dg.on) ev.preventDefault(); }, {passive:false});
document.addEventListener('pointerup', () => dgEnd(false));
document.addEventListener('pointercancel', () => dgEnd(true));
document.addEventListener('click', ev => { if(dg.swallow){ ev.preventDefault(); ev.stopPropagation(); dg.swallow = false; } }, true);

document.addEventListener('mousedown', ev => { if(ev.target.closest && ev.target.closest('.fmt')) ev.preventDefault(); });
document.addEventListener('paste', ev => { const b = ev.target.closest && ev.target.closest('#edBody'); if(!b) return; ev.preventDefault();
  const imgs = Array.from((ev.clipboardData && ev.clipboardData.files) || []).filter(f => /^image\//.test(f.type)); if(imgs.length){ saveImgRange(); addImages(imgs); return; } const tx = (ev.clipboardData || window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, tx); });

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const cal = ev.target.closest && ev.target.closest('a[data-cal]');
  if(cal){ const t = S.tasks[cal.dataset.cal]; if(t && t.at) patch('tasks', t.id, {cal: t.at}); if($('#layer').innerHTML) setTimeout(closeSheet, 400); return; }
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act; if(!A[act]) return;
  if(el.tagName === 'A') return;
  if(act !== 'scrim') ev.preventDefault();
  if(saveT && act !== 'scrim'){ clearTimeout(saveT); saveT = null; edSave(); }
  A[act](el.dataset, el, ev);
});
document.addEventListener('contextmenu', ev => { if(dg.on || dg.timer && dg.el){ ev.preventDefault(); if(dg.on) return; } const el = ev.target.closest('[data-menu]'); if(el){ ev.preventDefault(); itemMenu(el.dataset.menu); return; } const t = ev.target.closest('[data-tmenu]'); if(t){ ev.preventDefault(); taskSheet(t.dataset.tmenu); } });
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.matches && t.matches('textarea[data-auto]')){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
  if(t.closest && t.closest('#editor')){ if(t.id === 'edProgress'){ const l = t.parentElement.firstChild; if(l && l.nodeType === 3) l.textContent = 'প্রগ্রেস '+bn(t.value)+'%'; } edDirty(); }
  if(t.id === 'sIn') runSearch(t.value);
});
document.addEventListener('change', ev => {
  if(ev.target.id === 'imgIn'){ addImages(ev.target.files); return; }
  const t = ev.target;
  if(t.closest && t.closest('#editor')){ clearTimeout(saveT); edSave(); }
  if(t.dataset && t.dataset.dash){ const off = Object.assign({}, sets().dashOff || {}); if(t.checked) delete off[t.dataset.dash]; else off[t.dataset.dash] = true; setSet({dashOff: off}); }
  if(t.dataset && t.dataset.today){ const off = Object.assign({}, sets().todayOff); if(t.checked) delete off[t.dataset.today]; else off[t.dataset.today] = true; setSet({todayOff: off}); }
  if(t.dataset && t.dataset.setk){ setSet({[t.dataset.setk]: t.checked}); }
  if(t.id === 'setFormats' || t.id === 'setChannels'){ const l = [...new Set(t.value.split('\n').map(x => x.trim()).filter(Boolean))].slice(0, 20); setSet({[t.id === 'setFormats' ? 'formats' : 'channels']: l.length ? l : null}); toast('সেভ হয়েছে'); }
  if(t.id === 'setName'){ setSet({name: t.value.trim()}); toast('সেভ হয়েছে'); }
  if(t.id === 'setHome'){ setSet({home: t.value}); toast('সেভ হয়েছে'); }
  if(t.id === 'driveAuto'){ put('meta', 'drive', Object.assign({}, driveMeta(), {auto: t.checked}), true); if(t.checked && drv.dirty) markDirty(); toast(t.checked ? 'নিজে থেকে ব্যাকআপ চালু' : 'নিজে থেকে ব্যাকআপ বন্ধ'); }
  if(t.id === 'impFile' && t.files && t.files[0]){
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result); let n = 0;
        COLS.forEach(c => { const src = data[c]; if(src && typeof src === 'object') Object.keys(src).forEach(id => { if(/^[A-Za-z0-9_\-.~:@+]{1,180}$/.test(id) && src[id] && typeof src[id] === 'object'){ put(c, id, src[id]); n++; } }); });
        toast(bn(n)+' টা জিনিস ফেরত আনা হয়েছে');
      } catch(e){ toast('ফাইলটা পড়া যায়নি। Hasan\'s Notebook-এর .json ব্যাকআপ বেছে নিন।'); }
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('focusout', ev => { if(ev.target.closest && ev.target.closest('#editor') && saveT){ clearTimeout(saveT); saveT = null; edSave(); } });
document.addEventListener('keydown', ev => {
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k'){ ev.preventDefault(); openSearch(); return; }
  if(ev.key === 'Escape' && $('#layer').innerHTML){ closeSheet(); return; }
  if(((ev.metaKey && ev.key === '[') || (ev.altKey && ev.key === 'ArrowLeft')) && !(ev.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))){ ev.preventDefault(); A.back(); return; }
  const t = ev.target;
  if(ev.key === 'Enter' && !ev.shiftKey){
    if(t.id === 'cap' && st.view === 'today'){ ev.preventDefault(); A.capNote(); return; }
    if(t.id === 'cap' && st.view === 'inbox' && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); A.capNote(); return; }
    if(t.dataset && t.dataset.enter && A[t.dataset.enter]){ ev.preventDefault(); A[t.dataset.enter](t.dataset, t, ev); return; }
    if(t.id === 'sIn'){ const first = $('#sRes [data-act]'); if(first){ ev.preventDefault(); first.click(); } return; }
    if(t.id === 'edTitle'){ ev.preventDefault(); $('#edBody').focus(); return; }
  }
  if(ev.key === 'Enter' && t.closest && t.closest('.mm-node')){ ev.preventDefault(); A.mmNode(t.closest('.mm-node').dataset); }
  if(ev.altKey && ev.key.toLowerCase() === 'n'){ ev.preventDefault(); go('inbox'); setTimeout(() => { const c = $('#cap'); c && c.focus(); }, 40); }
});
window.addEventListener('beforeunload', () => { if(saveT){ clearTimeout(saveT); edSave(); } });
const flushAll = () => { if(saveT){ clearTimeout(saveT); saveT = null; edSave(); } if(lsT) flushLocal(); };
window.addEventListener('pagehide', flushAll);
document.addEventListener('visibilitychange', () => { if(document.hidden) flushAll(); });
document.addEventListener('visibilitychange', () => { if(document.hidden && drv.dirty && driveMeta().auto){ clearTimeout(drv.timer); autoBackup(); } });

renderSide(); renderTabs();
initStore();
})();
</script>
